<!DOCTYPE html>
<!-- ============================================================
     MOCK FINAL

     This page is a shell. assets/final.js renders everything into
     #fx-mock from data/final-exam.js and data/final-mock.js, which
     tools/build-final-exam.js GENERATES from tools/final-exam-scope.js
     and the site's own pages, and from data/quiz-bank.js, the same
     bank Build Your Own Exam uses. Nothing here is typed twice.

     You will almost never edit this file. To change what it shows,
     edit tools/final-exam-scope.js (what is on the final) or the page
     the content comes from, then run
         node tools/build-final-exam.js --write

     SCRIPT ORDER IS LOAD-BEARING: the data, then final.js, then
     site.js. final.js writes the headings and tables that
     site.js then builds on. See the header of assets/final.js.

     NO QUESTION WAS WRITTEN FOR THIS PAGE. It draws from the existing
     bank and the in-class questions, in the final's own proportions.
     On Start, final.js sets window.EXAM_DATA and injects assets/exam.js
     into #exam-root, the way quiz.js does for Build Your Own Exam.
     After grading it offers a retake of only the missed questions.
     ============================================================ -->
