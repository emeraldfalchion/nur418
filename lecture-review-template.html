<!DOCTYPE html>
<!-- ============================================================
     LECTURE REVIEW PAGE TEMPLATE

     One page per live class that had in-class practice questions
     (clickers, polls, "everybody answer this"). The questions are
     transcribed VERBATIM — this page is the archive of what the
     instructor actually asked, so it is the one place on the site
     where you must not improve the wording.

     To make a new one:
       1. Copy this file (e.g. week3-lecture-review.html).
       2. Copy data/lecture-review-template.js to a matching name and
          point the <script> tag below at it.
       3. Change the <title>, the <h1>, and the intro note.
       4. Add an entry to SITE.groups in assets/site.js and a tile to
          index.html.

     ALWAYS ask for the slide deck before writing the options. Working
     from a transcript alone gets you the right ANSWERS and the wrong
     DISTRACTORS — you can hear which option was picked but not what
     the other three said. If no deck is available, say so in the data
     file's header comment and flag every reconstructed option.
     ============================================================ -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture Review Template — Study Guide</title>
<script>(function(){try{var p=new URLSearchParams(location.search).get('theme');var t=p||localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');if(p){try{localStorage.setItem('theme',p)}catch(e){}}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<link rel="stylesheet" href="assets/styles.css?v=20260830">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>

<main id="content">
<div class="page-inner">

  <header class="page-head">
    <p class="eyebrow">Exam Prep</p>
    <h1>Lecture Review Template</h1>
  </header>

  <p class="note">The practice questions the instructor used during the live class, with the answers discussed. Choose your answer for each, then submit to see your score and rationales.</p>

  <div id="exam-root"></div>

  <nav class="page-flip" data-page-flip></nav>
  <footer class="site-foot">Built from the course lecture material — for personal study use.</footer>

</div>
</main>

<script src="data/lecture-review-template.js?v=20260830"></script>
<script src="assets/site.js?v=20260830"></script>
<script src="assets/exam.js?v=20260830"></script>
</body>
</html>
