<!DOCTYPE html>
<!-- ============================================================
     CRAM SHEET

     This page is a shell. assets/final.js renders everything into
     #fx-cram from data/final-exam.js, which
     tools/build-final-exam.js GENERATES from tools/final-exam-scope.js
     and the site's own pages. Nothing here is typed twice.

     You will almost never edit this file. To change what it shows,
     edit tools/final-exam-scope.js (what is on the final) or the page
     the content comes from, then run
         node tools/build-final-exam.js --write

     SCRIPT ORDER IS LOAD-BEARING: the data, then final.js, then
     site.js, then study.js. final.js writes the headings and tables that
     site.js and study.js then build on. See the header of assets/final.js.

     PRINTING. "Print the cram sheet" prints only the topics ticked in
     the panel. "Print my weak terms" prints the terms marked Learning
     or Don't know in the Term Drill. Both work by putting a class on
     <body> and calling window.print(): see the FINAL EXAM print rules
     at the end of assets/styles.css.
     ============================================================ -->
